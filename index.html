  <!-- MARUS FIX v5: normalize filename→file + strip crossOrigin -->
<script>
(function(){
  var _data;

  // Intercept setiap set ke window.MARUS_EPISODES
  Object.defineProperty(window, 'MARUS_EPISODES', {
    configurable: true,
    get: function(){ return _data; },
    set: function(v){
      if (Array.isArray(v)) {
        v.forEach(function(ep){
          if (!ep) return;
          // FIX #1: filename → file
          if (!ep.file && ep.filename) ep.file = ep.filename;
          // Kalau tanpa ekstensi, tambah .mp3
          if (ep.file && !/\.(mp3|m4a|wav|aac|ogg|mp4)$/i.test(ep.file)) {
            ep.file = ep.file + '.mp3';
          }
        });
      }
      _data = v;
      stripCrossOrigin();
    }
  });

  // FIX #2: buang crossOrigin dari setiap <audio>
  function stripCrossOrigin(){
    document.querySelectorAll('audio').forEach(function(a){
      if (a.hasAttribute('crossorigin')) {
        a.removeAttribute('crossorigin');
        try { a.crossOrigin = null; } catch(e){}
      }
    });
  }

  // Safety net: observer untuk <audio> yang dibuat belakangan oleh React
  var obs = new MutationObserver(function(muts){
    muts.forEach(function(m){
      if (m.type === 'attributes' && m.attributeName === 'crossorigin') {
        m.target.removeAttribute('crossorigin');
      }
      if (m.addedNodes) {
        m.addedNodes.forEach(function(n){
          if (n.nodeType === 1) {
            if (n.tagName === 'AUDIO') {
              n.removeAttribute('crossorigin');
            } else if (n.querySelectorAll) {
              n.querySelectorAll('audio[crossorigin]').forEach(function(a){
                a.removeAttribute('crossorigin');
              });
            }
          }
        });
      }
    });
  });
  obs.observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ['crossorigin']
  });
